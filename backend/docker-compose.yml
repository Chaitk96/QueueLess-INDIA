services:
  postgres:
    image: postgres:17-alpine
    container_name: queueless-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: queueless
      POSTGRES_USER: queueless
      POSTGRES_PASSWORD: queueless_dev
    ports:
      - "5432:5432"
    volumes:
      - queueless-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queueless -d queueless"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  queueless-postgres-data:
