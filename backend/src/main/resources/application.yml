server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  application:
    name: queueless-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/queueless}
    username: ${DATABASE_USERNAME:queueless}
    password: ${DATABASE_PASSWORD:queueless_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  master-admin:
    email: ${MASTER_ADMIN_EMAIL:masteradmin@gmail.com}
    password: ${MASTER_ADMIN_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-this-to-a-long-random-value-at-least-32-bytes}
    ttl-seconds: ${JWT_TTL_SECONDS:86400}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
billing:
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
